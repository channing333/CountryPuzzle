<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>認識國家 — 國旗猜謎</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card-2: #273549;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --correct: #22c55e;
    --wrong: #ef4444;
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
    background: linear-gradient(160deg, #0f172a 0%, #1e1b4b 100%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
  }
  header {
    width: 100%;
    max-width: 640px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 8px;
  }
  header h1 { font-size: 1.5rem; letter-spacing: 2px; }
  header h1 span { color: var(--accent); }
  .stats {
    display: flex;
    gap: 14px;
    font-size: 0.9rem;
    color: var(--muted);
  }
  .stats b { color: var(--text); font-size: 1.05rem; }
  .mode-switch {
    display: flex;
    gap: 4px;
    background: var(--card);
    padding: 5px;
    border-radius: 999px;
    margin-bottom: 16px;
  }
  .mode-switch button {
    padding: 9px 22px;
    border: none;
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    font-family: inherit;
    font-size: .95rem;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .mode-switch button.active {
    background: var(--accent);
    color: #082f49;
    font-weight: bold;
  }
  .quiz-card {
    width: 100%;
    max-width: 640px;
    background: var(--card);
    border-radius: var(--radius);
    padding: 28px;
    box-shadow: 0 10px 40px rgba(0,0,0,.4);
  }
  .flag-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 24px;
  }
  .flag-wrap img {
    width: 320px;
    max-width: 100%;
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,.5);
    background: #fff;
  }
  .target-name {
    text-align: center;
    font-size: 2rem;
    font-weight: bold;
    letter-spacing: 3px;
    margin: 6px 0 2px;
  }
  .target-en {
    text-align: center;
    color: var(--muted);
    font-size: 1.05rem;
    margin-bottom: 8px;
  }
  .speak-btn {
    border: none;
    background: var(--card-2);
    color: var(--accent);
    font-size: 1rem;
    padding: 4px 12px;
    border-radius: 999px;
    cursor: pointer;
    vertical-align: middle;
    margin-left: 8px;
    transition: filter .15s, transform .1s;
  }
  .speak-btn:hover { filter: brightness(1.3); transform: scale(1.05); }
  .options button .opt-en {
    display: block;
    font-size: .8rem;
    color: var(--muted);
    margin-top: 3px;
  }
  .options button.correct .opt-en, .options button.wrong .opt-en { color: inherit; opacity: .8; }
  .question { text-align: center; font-size: 1.15rem; margin-bottom: 20px; color: var(--muted); }
  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  @media (max-width: 480px) { .options:not(.flag-opts) { grid-template-columns: 1fr; } }
  .options button {
    padding: 14px 12px;
    font-size: 1.05rem;
    font-family: inherit;
    background: var(--card-2);
    color: var(--text);
    border: 2px solid transparent;
    border-radius: 12px;
    cursor: pointer;
    transition: transform .1s, border-color .15s, background .15s;
  }
  .options.flag-opts button { padding: 10px; }
  .options.flag-opts img {
    width: 100%;
    display: block;
    border-radius: 8px;
    background: #fff;
    pointer-events: none;
    aspect-ratio: 4 / 2.7;
    object-fit: contain;
  }
  .options button:hover:not(.answered) { border-color: var(--accent); transform: translateY(-2px); }
  .options button.answered { cursor: default; opacity: .85; }
  .options button.correct { background: var(--correct); border-color: var(--correct); color: #052e16; font-weight: bold; opacity: 1; }
  .options button.wrong { background: var(--wrong); border-color: var(--wrong); color: #450a0a; font-weight: bold; opacity: 1; }
  /* 作答後 hover 選項顯示該國國旗 */
  .options button { position: relative; }
  .options button .flag-tip {
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    width: 160px;
    padding: 6px;
    background: #0b1220;
    border: 1px solid var(--card-2);
    border-radius: 10px;
    box-shadow: 0 6px 20px rgba(0,0,0,.55);
    display: none;
    z-index: 60;
    pointer-events: none;
  }
  .options button .flag-tip img {
    width: 100%;
    display: block;
    border-radius: 4px;
    background: #fff;
  }
  /* 電腦（有滑鼠）：hover 顯示 */
  @media (hover: hover) and (pointer: fine) {
    .options button.answered:hover .flag-tip { display: block; }
  }
  /* 手機（觸控）：點擊切換顯示 */
  .options button.show-tip .flag-tip { display: block; }
  /* 地理位置地圖 */
  .map-sec { margin-bottom: 16px; }
  .map-title { color: var(--accent); font-weight: bold; font-size: .95rem; margin-bottom: 10px; }
  .map-grid {
    display: grid;
    grid-template-columns: 3fr 2fr;
    gap: 10px;
    align-items: start;
  }
  @media (max-width: 480px) { .map-grid { grid-template-columns: 1fr; } }
  .map-box {
    position: relative;
    background: #0b1220;
    border-radius: 10px;
    overflow: hidden;
  }
  .map-box canvas { display: block; width: 100%; }
  .map-tag {
    position: absolute;
    top: 6px;
    left: 8px;
    font-size: .72rem;
    color: var(--muted);
    background: rgba(11,18,32,.75);
    padding: 2px 8px;
    border-radius: 999px;
    pointer-events: none;
  }
  .map-dot {
    position: absolute;
    width: 8px;
    height: 8px;
    margin: -4px 0 0 -4px;
    border-radius: 50%;
    background: #f87171;
    box-shadow: 0 0 4px rgba(248,113,113,.9);
    pointer-events: none;
  }
  .map-dot::after {
    content: "";
    position: absolute;
    inset: -5px;
    border-radius: 50%;
    border: 2px solid #f87171;
    animation: mapPulse 1.6s ease-out infinite;
  }
  @keyframes mapPulse {
    from { transform: scale(.5); opacity: 1; }
    to { transform: scale(2.4); opacity: 0; }
  }
  /* 選項的鍵盤快捷鍵提示（觸控裝置沒有鍵盤，不顯示） */
  .opt-key {
    position: absolute;
    top: 6px;
    left: 8px;
    font-size: .7rem;
    color: var(--muted);
    background: rgba(11,18,32,.55);
    border-radius: 6px;
    padding: 1px 6px;
    pointer-events: none;
  }
  @media (hover: none) and (pointer: coarse) { .opt-key { display: none; } }
  .result-banner {
    text-align: center;
    font-size: 1.2rem;
    font-weight: bold;
    margin-top: 18px;
    min-height: 1.6em;
  }
  .result-banner.ok { color: var(--correct); }
  .result-banner.ng { color: var(--wrong); }
  .info-card {
    width: 100%;
    max-width: 640px;
    background: var(--card);
    border-radius: var(--radius);
    padding: 24px 28px;
    margin-top: 18px;
    box-shadow: 0 10px 40px rgba(0,0,0,.4);
    animation: slideUp .35s ease;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .info-card h2 { font-size: 1.3rem; margin-bottom: 4px; }
  .info-card .en-name { color: var(--muted); font-size: .95rem; margin-bottom: 16px; }
  .info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px 18px;
    margin-bottom: 16px;
  }
  .info-grid .item {
    background: var(--card-2);
    border-radius: 10px;
    padding: 10px 14px;
  }
  .info-grid .label { font-size: .78rem; color: var(--muted); margin-bottom: 2px; }
  .info-grid .value { font-size: .98rem; }
  .fact {
    background: rgba(56,189,248,.08);
    border-left: 4px solid var(--accent);
    border-radius: 0 10px 10px 0;
    padding: 12px 16px;
    font-size: .95rem;
    line-height: 1.7;
  }
  .fact .label { color: var(--accent); font-weight: bold; margin-right: 6px; }
  .next-btn {
    display: block;
    margin: 22px auto 0;
    padding: 13px 48px;
    font-size: 1.1rem;
    font-family: inherit;
    font-weight: bold;
    color: #082f49;
    background: var(--accent);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    transition: transform .1s, filter .15s;
  }
  .next-btn:hover { filter: brightness(1.15); transform: translateY(-2px); }
  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
  }
  .toolbar .mode-switch { margin-bottom: 0; }
  .badge {
    display: inline-block;
    min-width: 1.4em;
    padding: 1px 6px;
    margin-left: 4px;
    border-radius: 999px;
    background: var(--wrong);
    color: #fff;
    font-size: .75rem;
    font-weight: bold;
  }
  .gallery-btn {
    padding: 9px 18px;
    border: none;
    border-radius: 999px;
    background: var(--card);
    color: var(--text);
    font-family: inherit;
    font-size: .95rem;
    cursor: pointer;
    transition: color .15s;
  }
  .gallery-btn:hover { color: var(--accent); }
  .gallery { width: 100%; max-width: 640px; }
  .gallery .progress { text-align: center; color: var(--muted); margin-bottom: 4px; }
  .gallery .continent-title { margin: 18px 4px 10px; font-size: 1.05rem; color: var(--accent); }
  .gallery .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
    gap: 10px;
  }
  .gallery .card {
    background: var(--card);
    border-radius: 10px;
    padding: 8px 6px;
    text-align: center;
  }
  .gallery .card img {
    width: 100%;
    aspect-ratio: 4 / 2.7;
    object-fit: contain;
    border-radius: 4px;
    background: #fff;
  }
  .gallery .card.locked img { filter: grayscale(1) brightness(.55); }
  .gallery .card .nm { font-size: .72rem; margin-top: 5px; color: var(--text); line-height: 1.3; }
  .gallery .card.locked .nm { color: var(--muted); }
  .gallery .card.unlocked { cursor: pointer; transition: outline .1s; }
  .gallery .card.unlocked:hover { outline: 2px solid var(--accent); }
  .fact.flag-fact {
    margin-top: 12px;
    background: rgba(251,191,36,.08);
    border-left-color: #fbbf24;
  }
  .fact.flag-fact .label { color: #fbbf24; }
  .confuse {
    margin-top: 12px;
    background: rgba(239,68,68,.07);
    border-left: 4px solid var(--wrong);
    border-radius: 0 10px 10px 0;
    padding: 12px 16px;
  }
  .confuse-title { color: #f87171; font-weight: bold; font-size: .95rem; margin-bottom: 10px; }
  .confuse-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
    gap: 10px;
    margin-bottom: 10px;
  }
  .confuse-grid .ccard { text-align: center; }
  .confuse-grid img {
    width: 100%;
    aspect-ratio: 4 / 2.7;
    object-fit: contain;
    background: #fff;
    border-radius: 4px;
  }
  .confuse-grid .cnm { font-size: .75rem; margin-top: 4px; }
  .confuse-grid .cen { font-size: .68rem; color: var(--muted); }
  .confuse-note { font-size: .85rem; color: var(--muted); line-height: 1.7; }
  /* 名詞小辭典 tooltip */
  .term {
    border-bottom: 1px dashed var(--accent);
    cursor: help;
    position: relative;
  }
  .term:hover::after, .term.show::after {
    content: attr(data-tip);
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    width: max-content;
    max-width: min(280px, 78vw);
    background: #0b1220;
    color: var(--text);
    border: 1px solid var(--card-2);
    border-radius: 10px;
    padding: 9px 13px;
    font-size: .8rem;
    line-height: 1.7;
    white-space: normal;
    text-align: left;
    z-index: 60;
    box-shadow: 0 6px 20px rgba(0,0,0,.55);
    pointer-events: none;
  }
  .term:hover::before, .term.show::before {
    content: "";
    position: absolute;
    bottom: calc(100% + 2px);
    left: 50%;
    transform: translateX(-50%);
    border: 6px solid transparent;
    border-top-color: #0b1220;
    z-index: 61;
    pointer-events: none;
  }
  .confuse.name-confuse {
    background: rgba(167,139,250,.07);
    border-left-color: #a78bfa;
  }
  .name-confuse .confuse-title { color: #a78bfa; }
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .modal-box {
    background: var(--card);
    border-radius: var(--radius);
    padding: 26px 30px;
    width: min(90vw, 380px);
    box-shadow: 0 10px 40px rgba(0,0,0,.6);
  }
  .modal-box h2 { margin-bottom: 16px; font-size: 1.2rem; }
  .setting-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 11px 4px;
    border-bottom: 1px solid var(--card-2);
    cursor: pointer;
    font-size: .98rem;
  }
  .setting-row input[type="checkbox"] {
    width: 20px;
    height: 20px;
    accent-color: var(--accent);
    cursor: pointer;
  }
  /* 設定開關的隱藏規則 */
  body.no-en .opt-en, body.no-en #target-en-text, body.no-en #info-en { display: none !important; }
  body.no-speak .speak-btn { display: none !important; }
  body.no-flagdesign .flag-fact { display: none !important; }
  body.no-confuse #confuse, body.no-confuse #nconfuse { display: none !important; }
  .hidden { display: none !important; }
  footer { margin-top: 28px; color: var(--muted); font-size: .8rem; text-align: center; line-height: 1.8; }
</style>
</head>
<body>

<header>
  <h1>🌍 認識<span>國家</span></h1>
  <div class="stats">
    <div>題數 <b id="stat-total">0</b></div>
    <div>答對 <b id="stat-correct">0</b></div>
    <div>連答 <b id="stat-streak">0</b></div>
    <div>最佳連答 <b id="stat-best">0</b></div>
  </div>
</header>

<div class="toolbar">
  <div class="mode-switch">
    <button id="mode-f2n" class="active">看國旗猜國家</button>
    <button id="mode-n2f">看國名猜國旗</button>
  </div>
  <div class="mode-switch">
    <button id="src-easy">簡單 60 國</button>
    <button id="src-all" class="active">全部 197 國</button>
    <button id="src-review">錯題複習<span class="badge hidden" id="review-count">0</span></button>
  </div>
  <button class="gallery-btn" id="gallery-btn">📖 圖鑑</button>
  <button class="gallery-btn" id="settings-btn" title="設定">⚙️</button>
</div>

<div class="quiz-card">
  <div class="flag-wrap" id="flag-wrap"><img id="flag" alt="國旗" /></div>
  <div class="target-name hidden" id="target-name"></div>
  <div class="target-en hidden" id="target-en"><span id="target-en-text"></span><button class="speak-btn" id="speak-target" title="唸出英文發音">🔊</button></div>
  <div class="question" id="question">這是哪一個國家的國旗？</div>
  <div class="options" id="options"></div>
  <div class="result-banner" id="banner"></div>
</div>

<div class="info-card hidden" id="info">
  <h2 id="info-name"></h2>
  <div class="en-name"><span id="info-en"></span><button class="speak-btn" id="speak-info" title="唸出英文發音">🔊</button></div>
  <div class="info-grid">
    <div class="item"><div class="label">首都</div><div class="value" id="info-capital"></div></div>
    <div class="item"><div class="label">所在洲</div><div class="value" id="info-continent"></div></div>
    <div class="item"><div class="label">人口（約）</div><div class="value" id="info-pop"></div></div>
    <div class="item"><div class="label">主要語言</div><div class="value" id="info-lang"></div></div>
    <div class="item"><div class="label">貨幣</div><div class="value" id="info-currency"></div></div>
    <div class="item"><div class="label">主要宗教</div><div class="value" id="info-religion"></div></div>
  </div>
  <div class="map-sec hidden" id="map-sec">
    <div class="map-title">🗺️ 地理位置 — <span id="map-caption"></span></div>
    <div class="map-grid">
      <div class="map-box"><canvas id="map-world"></canvas><div class="map-tag">🌐 世界</div><div class="map-dot hidden" id="dot-world"></div></div>
      <div class="map-box"><canvas id="map-zoom"></canvas><div class="map-tag" id="map-zoom-tag"></div><div class="map-dot hidden" id="dot-zoom"></div></div>
    </div>
  </div>
  <div class="fact"><span class="label">特色</span><span id="info-fact"></span></div>
  <div class="fact flag-fact"><span class="label">國旗設計</span><span id="info-flagdesign"></span></div>
  <div class="confuse hidden" id="confuse">
    <div class="confuse-title">👀 容易混淆的國旗</div>
    <div class="confuse-grid" id="confuse-grid"></div>
    <div class="confuse-note" id="confuse-note"></div>
  </div>
  <div class="confuse name-confuse hidden" id="nconfuse">
    <div class="confuse-title">🔤 名字容易混淆</div>
    <div class="confuse-grid" id="nconfuse-grid"></div>
    <div class="confuse-note" id="nconfuse-note"></div>
  </div>
  <button class="next-btn" id="next">下一題 ➜</button>
</div>

<div class="modal hidden" id="settings-modal">
  <div class="modal-box">
    <h2>⚙️ 設定</h2>
    <label class="setting-row"><span>選項附註英文國名</span><input type="checkbox" id="set-en"></label>
    <label class="setting-row"><span>發音按鈕 🔊</span><input type="checkbox" id="set-speak"></label>
    <label class="setting-row"><span>國旗設計理念</span><input type="checkbox" id="set-flagdesign"></label>
    <label class="setting-row"><span>容易混淆提示（國旗／名字）</span><input type="checkbox" id="set-confuse"></label>
    <button class="next-btn" id="settings-close">完成</button>
  </div>
</div>

<div class="gallery hidden" id="gallery"></div>

<footer>
  <span id="country-count"></span><br>
  國旗圖片來源：flagcdn.com（需要網路連線）
</footer>

<script src="audio/manifest.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
const COUNTRIES = [
  // ===== 亞洲 =====
  { code:"tw", zh:"臺灣", en:"Taiwan", capital:"臺北", continent:"亞洲", pop:"2,300 萬", lang:"中文（華語）", currency:"新臺幣 (TWD)", flag:"「青天白日滿地紅」：藍色象徵自由與青天，白日十二道光芒代表十二時辰與自強不息，紅色象徵先烈的犧牲。", fact:"半導體產業重鎮，台積電生產全球九成以上的先進製程晶片；夜市文化與珍珠奶茶聞名世界。" },

  { code:"cl", zh:"智利", en:"Chile", capital:"聖地牙哥", continent:"南美洲", pop:"1,960 萬", lang:"西班牙語", currency:"披索 (CLP)", flag:"白紅象徵安地斯山雪與獨立熱血，藍色方格與白色「孤星」代表天空與國家的統一。", fact:"世界最狹長的國家，南北長 4,300 公里但平均寬僅 180 公里；阿塔卡馬沙漠是地球上最乾燥的地方。" },
  { code:"pe", zh:"祕魯", en:"Peru", capital:"利馬", continent:"南美洲", pop:"3,400 萬", lang:"西班牙語、克丘亞語", currency:"索爾 (PEN)", flag:"紅白紅直條，傳說解放者聖馬丁看見紅白相間的火鶴群飛起，決定以此作為新國家的顏色。", fact:"印加帝國的中心，馬丘比丘古城建於海拔 2,430 公尺的山脊上；馬鈴薯的原產地，品種超過 3,000 種。" },

let geoData = null, geoPromise = null;
function loadGeo() {
  if (!geoPromise) {
    geoPromise = (typeof topojson === "undefined"
      ? Promise.reject()
      : fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json")
          .then(r => r.json())
          .then(t => {
            const feats = topojson.feature(t, t.objects.countries).features;
            unwrapRings(feats);
            geoData = feats;
          })
    ).catch(() => { geoData = null; });
  }
  return geoPromise;
}

// 微型國家在低解析度地圖裡沒有自己的圖形（點會落在鄰國），只顯示標記點、不亮國土
const NO_SHAPE = new Set(["sg","li","mc","ad","sm","va"]);
// 把經度平移到與前一點連續（處理跨換日線的圖形，如斐濟）
function nearLon(x, ref) {
  if (x - ref > 180) return x - 360;
  if (ref - x > 180) return x + 360;
  return x;
}
// 載入後把每個環的經度展開成連續數列，跨換日線的環才不會被撕裂
function unwrapRings(features) {
  for (const f of features) {
    const polys = f.geometry.type === "Polygon" ? [f.geometry.coordinates] : f.geometry.coordinates;
    for (const poly of polys) for (const ring of poly) {
      for (let i = 1; i < ring.length; i++) ring[i][0] = nearLon(ring[i][0], ring[i - 1][0]);
    }
  }
}
// 射線法：點是否在環內
function pip(lon, lat, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
    if ((yi > lat) !== (yj > lat) && lon < (xj - xi) * (lat - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
// 找出包含該點的國家圖形（用來把國土整塊亮起來；小島國在低解析度地圖裡沒有圖形就只顯示標記點）
function featureAt(lon, lat) {
  if (!geoData) return null;
  for (const f of geoData) {
    const polys = f.geometry.type === "Polygon" ? [f.geometry.coordinates] : f.geometry.coordinates;
    for (const poly of polys) {
      // 展開後的環經度可能落在 ±360 的任一側，測三個候選經度
      for (const L of [lon - 360, lon, lon + 360]) {
        if (pip(L, lat, poly[0]) && poly.slice(1).every(h => !pip(L, lat, h))) return f;
      }
    }
  }
  return null;
}

function drawMap(canvas, dot, b, pos, target, sh, merc) {
  const cssW = canvas.parentElement.clientWidth || 300;
  let X, Y, cssH;
  if (merc) {
    // 麥卡托投影（Google 地圖同款），形狀不失真
    const rad = d => d * Math.PI / 180;
    const mY = lat => Math.log(Math.tan(Math.PI / 4 + rad(Math.max(-84, Math.min(84, lat))) / 2));
    const x0 = rad(b[0]), yTop = mY(b[3]);
    const s = cssW / (rad(b[1]) - x0);
    cssH = Math.round((yTop - mY(b[2])) * s);
    X = lon => (rad(sh(lon)) - x0) * s;
    Y = lat => (yTop - mY(lat)) * s;
  } else {
    // 等距圓柱投影（世界全圖用，緯度均勻好對照）
    const s = cssW / (b[1] - b[0]);
    cssH = Math.round((b[3] - b[2]) * s);
    X = lon => (sh(lon) - b[0]) * s;
    Y = lat => (b[3] - lat) * s;
  }
  const dpr = window.devicePixelRatio || 1;
  canvas.style.height = cssH + "px";
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.fillStyle = "#0b1220";
  ctx.fillRect(0, 0, cssW, cssH);
  const drawFeature = (f, fill, stroke) => {
    const polys = f.geometry.type === "Polygon" ? [f.geometry.coordinates] : f.geometry.coordinates;
    ctx.beginPath();
    for (const poly of polys) for (const ring of poly) {
      let prev = ring[0][0]; // 逐點展開經度，避免跨換日線的圖形畫出橫貫地圖的線
      for (let i = 0; i < ring.length; i++) {
        prev = nearLon(ring[i][0], prev);
        const x = X(prev), y = Y(ring[i][1]);
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.closePath();
    }
    ctx.fillStyle = fill;
    ctx.fill("evenodd");
    ctx.strokeStyle = stroke;
    ctx.lineWidth = .5;
    ctx.stroke();
  };
  for (const f of geoData) {
    if (f.properties.name === "Antarctica") continue;
    drawFeature(f, "#2b3a54", "#0b1220");
  }
  if (target) drawFeature(target, "rgba(56,189,248,.8)", "#7dd3fc");
  dot.style.left = (X(pos[1]) / cssW * 100) + "%";
  dot.style.top = (Y(pos[0]) / cssH * 100) + "%";
  dot.classList.remove("hidden");
}

async function renderMaps(c) {
  const sec = $("map-sec");
  const pos = LATLNG[c.code];
  if (!pos) { sec.classList.add("hidden"); return; }
  await loadGeo();
  if (!geoData || infoCountry !== c) { if (!geoData) sec.classList.add("hidden"); return; }
  sec.classList.remove("hidden");
  $("map-caption").textContent = `${c.zh}（${c.continent}）`;
  const key = CONTINENT_KEY(c);
  $("map-zoom-tag").textContent = "📍 " + key;
  const target = NO_SHAPE.has(c.code) ? null : featureAt(pos[1], pos[0]);
  const shOce = lon => lon < -30 ? lon + 360 : lon;
  drawMap($("map-world"), $("dot-world"), WORLD_BOUNDS, pos, target, lon => lon, false);
  drawMap($("map-zoom"), $("dot-zoom"), CONT_BOUNDS[key], pos, target, key === "大洋洲" ? shOce : (lon => lon), true);
}

// ===== 發音 =====
// 1) 優先播放 audio/ 資料夾內的真人錄音（Wiktionary 志願者錄音，隨附於本專案，可離線使用）
// 2) 沒有錄音檔或播放失敗（例如 Safari 不支援 ogg 格式）時，
//    退回瀏覽器語音合成，並優先挑選最自然的 Natural／神經網路語音
const LOCAL_AUDIO = window.LOCAL_AUDIO || {}; // code -> 檔名，由 audio/manifest.js 提供；缺檔時自動退回語音合成
let currentAudio = null;

function pickBestVoice() {
  const voices = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith("en"));
  return (
    voices.find(v => /natural/i.test(v.name) && v.lang === "en-US") ||
    voices.find(v => /natural|neural|online/i.test(v.name)) ||
    voices.find(v => /Google US English/i.test(v.name)) ||
    voices.find(v => v.lang === "en-US") ||
    voices[0] || null
  );
}

function speakTTS(text) {
  if (!("speechSynthesis" in window)) {
    alert("此瀏覽器不支援語音功能");
    return;
  }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = 0.9;
  const v = pickBestVoice();
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

function speak(country) {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  const file = LOCAL_AUDIO[country.code];
  if (file) {
    currentAudio = new Audio("audio/" + file);
    currentAudio.onerror = () => speakTTS(country.en);
    currentAudio.play().catch(() => speakTTS(country.en));
  } else {
    speakTTS(country.en);
  }
}
// 某些瀏覽器需先觸發一次才載入語音清單
if ("speechSynthesis" in window) {
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function quizPool() {
  if (source === "easy") return COUNTRIES.filter(c => EASY_CODES.has(c.code));
  if (source === "review") return COUNTRIES.filter(c => store.wrong[c.code]);
  return COUNTRIES;
}

function pickQuestion() {
  const pool = quizPool();
  const answer = pool[Math.floor(Math.random() * pool.length)];
  // 干擾選項一律從全部國家挑，優先挑同洲的，增加挑戰性
  const sameContinent = shuffle(COUNTRIES.filter(c => c !== answer && CONTINENT_KEY(c) === CONTINENT_KEY(answer)));
  const others = shuffle(COUNTRIES.filter(c => c !== answer && CONTINENT_KEY(c) !== CONTINENT_KEY(answer)));
  const distractors = sameContinent.concat(others).slice(0, 3);
  return { answer, options: shuffle([answer, ...distractors]) };
}

function updateBadges() {

  const badge = $("review-count");
  badge.textContent = n;
  badge.classList.toggle("hidden", n === 0);
  if (!inGallery) $("gallery-btn").textContent = `📖 圖鑑 ${collectedSet.size}/${COUNTRIES.length}`;
}

function updateStats() {
  $("stat-total").textContent = stats.total;
  $("stat-correct").textContent = stats.correct;
  $("stat-streak").textContent = stats.streak;
  $("stat-best").textContent = stats.best;
}

const TERM_RE = new RegExp(
  Object.keys(GLOSSARY).sort((a, b) => b.length - a.length).join("|"), "g");

function annotate(text) {
  return (text || "").replace(TERM_RE, m => `<span class="term" data-tip="${GLOSSARY[m]}">${m}</span>`);
}

document.addEventListener("click", e => {

  if (t) t.classList.toggle("show");
});

// 渲染「容易混淆」區塊：boxId 為區塊 id，withEn 決定卡片是否附英文國名
function renderConfuse(boxId, grp, currentCode, withEn) {
  const box = $(boxId);
  if (!grp) {
    box.classList.add("hidden");
    return;
  }
  const grid = $(boxId + "-grid");
  grid.innerHTML = "";
  grp.codes.filter(k => k !== currentCode).forEach(k => {
    const cc = COUNTRIES.find(x => x.code === k);
    if (!cc) return;
    const card = document.createElement("div");
    card.className = "ccard";
    const img = document.createElement("img");
    img.loading = "lazy";
    img.src = FLAG_URL(k, 160);
    img.alt = cc.zh;
    const nm = document.createElement("div");
    nm.className = "cnm";
    nm.textContent = cc.zh;
    card.appendChild(img);
    card.appendChild(nm);
    if (withEn) {
      const en = document.createElement("div");
      en.className = "cen";
      en.textContent = cc.en;
      card.appendChild(en);
    }
    grid.appendChild(card);
  });
  $(boxId + "-note").innerHTML = annotate(grp.note);
  box.classList.remove("hidden");
}

let infoCountry = null; // 資訊卡目前顯示的國家（供 🔊 使用）
function showInfo(c, fromGallery) {
  infoCountry = c;
  $("next").classList.toggle("hidden", !!fromGallery);
  $("info-name").textContent = c.zh;
  $("info-en").textContent = c.en;
  $("info-capital").textContent = c.capital;
  $("info-continent").textContent = c.continent;
  $("info-pop").textContent = c.pop;
  $("info-lang").textContent = c.lang;
  $("info-currency").textContent = c.currency;
  $("info-religion").textContent = RELIGIONS[c.code] || "—";
  $("info-fact").innerHTML = annotate(c.fact);
  $("info-flagdesign").innerHTML = annotate(c.flag);
  // 容易混淆的國旗／名字
  renderConfuse("confuse", CONFUSE_MAP[c.code], c.code, false);
  renderConfuse("nconfuse", NAME_CONFUSE_MAP[c.code], c.code, true);
  // 地理位置地圖
  renderMaps(c);
  $("info").classList.remove("hidden");
  $("info").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function onAnswer(chosen, btn) {
  if (answered) return;
  answered = true;
  stats.total++;
  const buttons = $("options").querySelectorAll("button");
  const hoverable = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
  buttons.forEach(b => {
    b.classList.add("answered"); // 用 class 取代 disabled，觸控裝置作答後才點得到選項
    if (b.dataset.code === current.answer.code) b.classList.add("correct");
    // 看國旗猜國家模式：作答後可看各選項的國旗（電腦 hover、手機點擊）
    if (mode === "f2n") {
      const tip = document.createElement("span");
      tip.className = "flag-tip";
      const img = document.createElement("img");
      img.src = FLAG_URL(b.dataset.code, 160);
      img.srcset = `${FLAG_URL(b.dataset.code, 320)} 2x`;
      img.alt = "國旗";
      tip.appendChild(img);
      b.appendChild(tip);
      if (!hoverable) {
        b.addEventListener("click", () => {
          const showing = b.classList.contains("show-tip");
          buttons.forEach(x => x.classList.remove("show-tip"));
          if (!showing) b.classList.add("show-tip");
        });
      }
    }
  });
  const banner = $("banner");
  const code = current.answer.code;
  if (chosen.code === code) {
    stats.correct++;
    stats.streak++;
    if (stats.streak > stats.best) stats.best = stats.streak;
    let msg = "🎉 答對了！";
    // 圖鑑收集：第一次答對就點亮
    if (!collectedSet.has(code)) {
      collectedSet.add(code);
      msg += "（圖鑑新收集 ✨）";
    }
    // 錯題本：答對一次扣 1，扣到 0 移除
    if (store.wrong[code]) {
      store.wrong[code]--;
      if (store.wrong[code] <= 0) {
        delete store.wrong[code];
        msg += "（已從錯題本移除 ✅）";
      } else {
        msg += `（錯題本：再答對 ${store.wrong[code]} 次即移除）`;
      }
    }
    banner.textContent = msg;
    banner.className = "result-banner ok";
  } else {
    stats.streak = 0;
    btn.classList.add("wrong");
    // 加入錯題本：需連續答對 2 次才移除
    store.wrong[code] = 2;
    banner.textContent = (mode === "f2n"
      ? `❌ 答錯了，正確答案是「${current.answer.zh}」`
      : "❌ 答錯了，綠框才是正確的國旗") + "（已加入錯題本）";
    banner.className = "result-banner ng";
  }
  saveStore();
  updateStats();
  updateBadges();
  showInfo(current.answer);
}

function nextQuestion() {
  answered = false;
  $("banner").textContent = "";
  $("banner").className = "result-banner";
  $("info").classList.add("hidden");

  const box = $("options");
  box.innerHTML = "";

  // 錯題本清空時的提示畫面
  if (!quizPool().length) {
    current = null;
    answered = true;
    $("flag-wrap").classList.add("hidden");
    $("target-name").classList.add("hidden");
    $("target-en").classList.add("hidden");
    $("question").textContent = "🎉 錯題本是空的！答錯的題目會自動加進來，切換其他題庫繼續練習吧";
    return;
  }
  current = pickQuestion();

  if (mode === "f2n") {
    // 看國旗猜國家
    $("flag-wrap").classList.remove("hidden");
    $("target-name").classList.add("hidden");
    $("target-en").classList.add("hidden");
    $("question").textContent = "這是哪一個國家的國旗？";
    $("flag").src = FLAG_URL(current.answer.code, 320);
    $("flag").srcset = `${FLAG_URL(current.answer.code, 640)} 2x`;
    box.classList.remove("flag-opts");
    current.options.forEach((c, i) => {
      const btn = document.createElement("button");
      const zhSpan = document.createElement("span");
      zhSpan.textContent = c.zh;
      const enSpan = document.createElement("span");
      enSpan.className = "opt-en";
      enSpan.textContent = c.en;
      btn.appendChild(zhSpan);
      btn.appendChild(enSpan);
      const keySpan = document.createElement("span");
      keySpan.className = "opt-key";
      keySpan.textContent = i + 1;
      btn.appendChild(keySpan);
      btn.dataset.code = c.code;
      btn.addEventListener("click", () => onAnswer(c, btn));
      box.appendChild(btn);
    });
  } else {
    // 看國名猜國旗
    $("flag-wrap").classList.add("hidden");
    $("target-name").classList.remove("hidden");
    $("target-name").textContent = current.answer.zh;
    $("target-en").classList.remove("hidden");
    $("target-en-text").textContent = current.answer.en;
    $("question").textContent = "下面哪一面是它的國旗？";
    box.classList.add("flag-opts");
    current.options.forEach((c, i) => {
      const btn = document.createElement("button");
      const img = document.createElement("img");
      img.src = FLAG_URL(c.code, 320);
      img.srcset = `${FLAG_URL(c.code, 640)} 2x`;
      img.alt = "國旗選項";
      btn.appendChild(img);
      const keySpan = document.createElement("span");
      keySpan.className = "opt-key";
      keySpan.textContent = i + 1;
      btn.appendChild(keySpan);
      btn.dataset.code = c.code;
      btn.addEventListener("click", () => onAnswer(c, btn));
      box.appendChild(btn);
    });
  }
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function setMode(m) {
  if (mode === m) return;
  mode = m;
  $("mode-f2n").classList.toggle("active", m === "f2n");
  $("mode-n2f").classList.toggle("active", m === "n2f");
  nextQuestion();
}

function setSource(s) {
  source = s;
  ["easy", "all", "review"].forEach(k => $("src-" + k).classList.toggle("active", k === s));
  saveStore();
  if (inGallery) toggleGallery(); // 切題庫時回到測驗頁
  else nextQuestion();
}

// ===== 圖鑑 =====
const CONT_ORDER = ["亞洲", "歐洲", "北美洲", "南美洲", "非洲", "大洋洲"];

function renderGallery() {
  const g = $("gallery");
  g.innerHTML = "";
  const prog = document.createElement("div");
  prog.className = "progress";
  prog.textContent = `已收集 ${collectedSet.size} / ${COUNTRIES.length} 國（答對一次即點亮，點擊已點亮的國旗可查看資料）`;
  g.appendChild(prog);
  CONT_ORDER.forEach(cont => {
    const list = COUNTRIES.filter(c => CONTINENT_KEY(c) === cont);
    const got = list.filter(c => collectedSet.has(c.code)).length;
    const title = document.createElement("div");
    title.className = "continent-title";
    title.textContent = `${cont}（${got}/${list.length}）`;
    g.appendChild(title);
    const grid = document.createElement("div");
    grid.className = "grid";
    list.forEach(c => {
      const unlocked = collectedSet.has(c.code);
      const card = document.createElement("div");
      card.className = "card " + (unlocked ? "unlocked" : "locked");
      const img = document.createElement("img");
      img.loading = "lazy";
      img.src = FLAG_URL(c.code, 160);
      img.alt = "";
      const nm = document.createElement("div");
      nm.className = "nm";
      nm.textContent = unlocked ? c.zh : "？？？";
      card.appendChild(img);
      card.appendChild(nm);
      if (unlocked) card.addEventListener("click", () => showInfo(c, true));
      grid.appendChild(card);
    });
    g.appendChild(grid);
  });
}

function toggleGallery() {
  inGallery = !inGallery;
  document.querySelector(".quiz-card").classList.toggle("hidden", inGallery);
  $("gallery").classList.toggle("hidden", !inGallery);
  $("info").classList.add("hidden");
  if (inGallery) {
    renderGallery();
    $("gallery-btn").textContent = "⬅ 返回測驗";
    window.scrollTo({ top: 0 });
  } else {
    updateBadges();
    nextQuestion();
  }
}

$("mode-f2n").addEventListener("click", () => setMode("f2n"));
$("mode-n2f").addEventListener("click", () => setMode("n2f"));
$("src-easy").addEventListener("click", () => setSource("easy"));
$("src-all").addEventListener("click", () => setSource("all"));
$("src-review").addEventListener("click", () => setSource("review"));
$("gallery-btn").addEventListener("click", toggleGallery);
$("settings-btn").addEventListener("click", () => $("settings-modal").classList.remove("hidden"));
$("settings-close").addEventListener("click", () => $("settings-modal").classList.add("hidden"));
$("settings-modal").addEventListener("click", e => {
  if (e.target === $("settings-modal")) $("settings-modal").classList.add("hidden");
});
[["set-en","en"],["set-speak","speak"],["set-flagdesign","flagDesign"],["set-confuse","confuse"]].forEach(([id, key]) => {
  $(id).addEventListener("change", () => {
    store.settings[key] = $(id).checked;
    applySettings();
    saveStore();
  });
});
$("speak-info").addEventListener("click", () => { if (infoCountry) speak(infoCountry); });
$("speak-target").addEventListener("click", () => { if (current) speak(current.answer); });
$("next").addEventListener("click", nextQuestion);
document.addEventListener("keydown", e => {
  if (inGallery || !current || !$("settings-modal").classList.contains("hidden")) return;
  if (answered && (e.key === "Enter" || e.key === " ")) {
    e.preventDefault();
    nextQuestion();
  } else if (!answered && ["1", "2", "3", "4"].includes(e.key)) {
    // 數字鍵 1～4 選答案（含數字鍵盤）
    const btn = $("options").querySelectorAll("button")[+e.key - 1];
    if (btn) btn.click();
  }
});

$("country-count").textContent = `收錄全世界 ${COUNTRIES.length} 個國家（聯合國會員國＋臺灣、梵蒂岡、巴勒斯坦、科索沃）`;
["easy", "all", "review"].forEach(k => $("src-" + k).classList.toggle("active", k === source));
applySettings();
updateStats();
updateBadges();
nextQuestion();
loadGeo(); // 預先載入世界地圖資料
</script>
